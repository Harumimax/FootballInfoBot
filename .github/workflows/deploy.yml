name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: football-info-bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: /srv/football-info-bot
          REPO_URL: https://github.com/Harumimax/FootballInfoBot.git
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' REPO_URL='$REPO_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          if [ ! -d .git ]; then
            tmp_env=""
            if [ -f .env ]; then
              tmp_env="$(mktemp)"
              cp .env "$tmp_env"
            fi

            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} +
            rm -f .env
            git clone "$REPO_URL" .

            if [ -n "$tmp_env" ]; then
              mv "$tmp_env" .env
              chmod 600 .env
            fi
          else
            git fetch --prune origin
            git checkout main
            git pull --ff-only origin main
          fi

          if [ ! -f .env ]; then
            echo "Missing .env in $DEPLOY_PATH" >&2
            exit 1
          fi

          docker compose build bot worker migrate
          docker compose --profile tools run --rm migrate
          docker compose up -d bot worker
          docker compose ps
          REMOTE
