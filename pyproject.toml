[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "football-info-bot"
version = "0.1.0"
description = "Telegram bot for football match updates by subscription."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.7,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]

[project.scripts]
football-info-bot = "app.main_bot:main"
football-info-worker = "app.main_worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
